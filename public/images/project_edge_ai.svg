<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0A1628" />
      <stop offset="100%" stop-color="#00233D" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ai-bg)" />

  <!-- Neural Net Nodes & Connections -->
  <g stroke="rgba(0, 180, 216, 0.25)" stroke-width="1.5">
    <!-- Input to Hidden 1 -->
    <line x1="200" y1="140" x2="360" y2="100" />
    <line x1="200" y1="140" x2="360" y2="180" />
    <line x1="200" y1="140" x2="360" y2="260" />
    <line x1="200" y1="220" x2="360" y2="100" />
    <line x1="200" y1="220" x2="360" y2="180" />
    <line x1="200" y1="220" x2="360" y2="260" />
    <line x1="200" y1="220" x2="360" y2="340" />
    <line x1="200" y1="300" x2="360" y2="180" />
    <line x1="200" y1="300" x2="360" y2="260" />
    <line x1="200" y1="300" x2="360" y2="340" />

    <!-- Hidden 1 to Hidden 2 -->
    <line x1="360" y1="100" x2="520" y2="140" />
    <line x1="360" y1="100" x2="520" y2="220" />
    <line x1="360" y1="180" x2="520" y2="140" />
    <line x1="360" y1="180" x2="520" y2="220" />
    <line x1="360" y1="180" x2="520" y2="300" />
    <line x1="360" y1="260" x2="520" y2="140" />
    <line x1="360" y1="260" x2="520" y2="220" />
    <line x1="360" y1="260" x2="520" y2="300" />
    <line x1="360" y1="340" x2="520" y2="220" />
    <line x1="360" y1="340" x2="520" y2="300" />

    <!-- Hidden 2 to Output -->
    <line x1="520" y1="140" x2="680" y2="180" stroke="#00F0FF" stroke-width="2"/>
    <line x1="520" y1="220" x2="680" y2="180" stroke="#00F0FF" stroke-width="2"/>
    <line x1="520" y1="220" x2="680" y2="260" />
    <line x1="520" y1="300" x2="680" y2="260" />
  </g>

  <!-- Input Nodes -->
  <g fill="#00629B" stroke="#00B4D8" stroke-width="2">
    <circle cx="200" cy="140" r="10" />
    <circle cx="200" cy="220" r="10" />
    <circle cx="200" cy="300" r="10" />
  </g>

  <!-- Hidden Layer 1 Nodes -->
  <g fill="#004B78" stroke="#00B4D8" stroke-width="2">
    <circle cx="360" cy="100" r="12" />
    <circle cx="360" cy="180" r="12" />
    <circle cx="360" cy="260" r="12" fill="#00B4D8"/>
    <circle cx="360" cy="340" r="12" />
  </g>

  <!-- Hidden Layer 2 Nodes -->
  <g fill="#0B1A30" stroke="#00F0FF" stroke-width="2">
    <circle cx="520" cy="140" r="12" />
    <circle cx="520" cy="220" r="12" fill="#00F0FF"/>
    <circle cx="520" cy="300" r="12" />
  </g>

  <!-- Output Nodes -->
  <g fill="#050E1A" stroke="#10B981" stroke-width="3">
    <circle cx="680" cy="180" r="14" />
    <circle cx="680" cy="260" r="14" stroke="#64748B" />
  </g>

  <!-- Bounding Box / Computer Vision overlay on left -->
  <g transform="translate(40, 150)">
    <rect x="0" y="0" width="110" height="110" fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="4" y="16" fill="#00F0FF" font-family="monospace" font-size="10" font-weight="bold">OBJECT: 98.4%</text>
    <path d="M 0,0 L 15,0 M 0,0 L 0,15 M 110,0 L 95,0 M 110,0 L 110,15 M 0,110 L 15,110 M 0,110 L 0,95 M 110,110 L 95,110 M 110,110 L 110,95" stroke="#00F0FF" stroke-width="3" fill="none"/>
  </g>

  <!-- Title & Specs -->
  <text x="40" y="50" fill="#00F0FF" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="2">PROJECT // EDGE-VISION-NANO</text>
  <text x="40" y="72" fill="#94A3B8" font-family="sans-serif" font-size="12">Low-Latency Embedded TinyML Inference Engine</text>
  <text x="680" y="215" fill="#10B981" font-family="monospace" font-size="11" text-anchor="middle">DETECTION</text>
</svg>
