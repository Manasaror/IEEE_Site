<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="iot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061224" />
      <stop offset="100%" stop-color="#002E4E" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#iot-bg)" />
  
  <!-- Technical Grid -->
  <g stroke="rgba(0, 180, 216, 0.1)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>
  
  <!-- Mountain Silhouette (Himalayan / Garhwal telemetry context) -->
  <path d="M 0,380 L 180,240 L 320,320 L 480,180 L 640,300 L 800,210 L 800,450 L 0,450 Z" fill="#030A14" opacity="0.6"/>
  <path d="M 0,410 L 220,310 L 410,380 L 590,260 L 800,340 L 800,450 L 0,450 Z" fill="#08182B" opacity="0.8"/>

  <!-- Telemetry Tower & Waves -->
  <g transform="translate(480, 80)">
    <line x1="0" y1="100" x2="0" y2="0" stroke="#00B4D8" stroke-width="4" />
    <polygon points="-16,100 16,100 0,0" fill="none" stroke="#00B4D8" stroke-width="2" />
    <circle cx="0" cy="0" r="7" fill="#00B4D8" />
    <!-- Radio Waves -->
    <path d="M -20,-20 A 28,28 0 0,1 20,-20" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M -36,-36 A 50,50 0 0,1 36,-36" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M -52,-52 A 72,72 0 0,1 52,-52" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
  </g>

  <!-- IoT Node Module Representation -->
  <rect x="140" y="130" width="260" height="180" rx="12" fill="#0B1A30" stroke="#00B4D8" stroke-width="2" />
  <rect x="160" y="150" width="220" height="40" rx="6" fill="#050E1A" />
  <text x="175" y="175" fill="#00F0FF" font-family="monospace" font-size="14" font-weight="bold">TELEMETRY: ACTIVE</text>
  <circle cx="360" cy="170" r="5" fill="#10B981" />
  
  <text x="160" y="220" fill="#94A3B8" font-family="monospace" font-size="12">CH1: 2,140m ASL</text>
  <text x="160" y="245" fill="#94A3B8" font-family="monospace" font-size="12">LORA 868MHz // RSSI -68dBm</text>
  <text x="160" y="270" fill="#94A3B8" font-family="monospace" font-size="12">PWR: 12.8V SOLAR PV</text>
  <rect x="160" y="290" width="220" height="4" rx="2" fill="#1E293B" />
  <rect x="160" y="290" width="170" height="4" rx="2" fill="#00B4D8" />
  
  <!-- Technical Labels -->
  <text x="40" y="50" fill="#00B4D8" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="2">PROJECT // IOT-GARHWAL-01</text>
  <text x="40" y="70" fill="#64748B" font-family="sans-serif" font-size="12">Mountain Telemetry & Microclimate Sensing Grid</text>
</svg>
