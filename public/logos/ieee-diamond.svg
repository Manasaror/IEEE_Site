<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- IEEE Diamond -->
  <polygon points="50,4 96,50 50,96 4,50" fill="#00629B" stroke="#00629B" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Right Hand Rule / Electromagnetic Field Symbol in White -->
  <!-- Central Vertical Arrow pointing Up -->
  <line x1="50" y1="80" x2="50" y2="24" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <polygon points="50,16 42,28 58,28" fill="#FFFFFF"/>
  
  <!-- Circular field lines looping around the vertical conductor -->
  <!-- Back loop (dotted/hidden or subtle) & Front Loop -->
  <path d="M 28,52 C 28,42 72,42 72,52 C 72,62 28,62 28,52" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Arrow on field line indicating counter-clockwise circulation -->
  <polygon points="48,64 58,58 48,52" fill="#FFFFFF"/>
  <polygon points="52,40 42,46 52,52" fill="#FFFFFF"/>
</svg>
